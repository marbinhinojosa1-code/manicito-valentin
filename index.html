
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Para ti 💖</title>
    <style>
        body {
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            text-align: center;
            font-family: Arial, sans-serif;
            color: white;
        }
        h1 {
            margin-top: 100px;
            font-size: 42px;
        }
        p {
            font-size: 20px;
        }
        button {
            padding: 12px 25px;
            font-size: 20px;
            background-color: #ff4b5c;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background-color: #ff1e3c;
        }
    </style>
</head>
<body>

    <h1>¿Quieres ser mi San Valentín manicito? 💘</h1>
    <p>Te lo pregunto de una forma especial porque eres alguien muy importante para mí 💕</p>

    <button onclick="respuestaSi()">Sí 👻</button>
    <button onclick="respuestaNo()">No 😔</button>

    <script>
        function respuestaSi() {
            alert("Sabía que dirías que sí 👻❤️ Me haces muy feliz 💕");
        }

        function respuestaNo() {
            alert("¿Seguro? 😔 Piénsalo otra vez... 😅");
        }
    </script>

</body>
</html>
